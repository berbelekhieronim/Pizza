name: check
on: [push, pull_request]
jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - name: Wrangler, to test the Cloudflare version in the local Workers runtime
        run: npm ci --no-audit --no-fund
        working-directory: cloudflare
      - name: R, to check load_pizza.R (prebuilt; the apt mirror sometimes stalls for many minutes)
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
        timeout-minutes: 8
      # every check is listed on the run's summary page; the full log and the reports built from simulated data are
      # kept as artifacts of the run
      - name: Smoke test (analysis, study server, Cloudflare Worker, R, JavaScript, face detection)
        env:
          PIZZA_KEEP_OUTPUT: ${{ runner.temp }}/reports
          PIZZA_REQUIRE_CLOUDFLARE: '1'
        run: python tests/smoke_test.py 2>&1 | tee smoke-test.log; exit ${PIPESTATUS[0]}
      - name: Face detection benchmark
        if: matrix.python == '3.12'
        run: |
          { echo '### Face detection benchmark (300 drawn pizzas per kind)'; echo '```'; python tests/face_benchmark.py --n 300; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-log-and-reports-py${{ matrix.python }}
          path: |
            smoke-test.log
            ${{ runner.temp }}/reports
          retention-days: 30
