# Builds the reports and downloads of the study on Cloudflare (tools/cloud_sync.py). Started by "Build reports" on the
# researcher page (needs the PIZZA_GITHUB_TOKEN secret) or by hand (Actions -> reports -> Run workflow). With the
# repository variable PIZZA_REPORTS_AUTO = 1 also 5 minutes after the last session data came in and after each deploy. No schedule. Does nothing when no session changed. The log holds counts only; no data is kept as an artifact.
name: reports
on:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild everything even if nothing changed
        required: false
        default: 'false'
      wait:
        description: First wait for 5 quiet minutes after the last save (the site sets this when a session finishes)
        required: false
        default: 'false'
concurrency:                    # one build at a time; GitHub keeps one more queued, so finishing sessions never pile up runs
  group: cloudflare-reports
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  reports:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PIZZA_ADMIN_KEY: ${{ secrets.PIZZA_ADMIN_KEY }}
      PIZZA_SITE_URL: ${{ vars.PIZZA_SITE_URL }}
    steps:
      - name: Cloudflare set up?
        id: ready
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$PIZZA_ADMIN_KEY" ]; then echo "ok=1" >> "$GITHUB_OUTPUT";
          else echo "::notice::No reports to build: the study is not on Cloudflare yet (cloudflare/README.md)."; fi
      - uses: actions/checkout@v5
        if: steps.ready.outputs.ok
      - uses: actions/setup-python@v6
        if: steps.ready.outputs.ok
        with:
          python-version: '3.12'
      - name: Measures of pizzas analysed before (each pizza's slow measures are computed once per code version)
        if: steps.ready.outputs.ok
        uses: actions/cache@v4
        with:
          path: ~/.cache/pizza-measures
          key: pizza-measures-${{ hashFiles('analysis/analyse.py') }}-${{ github.run_id }}
          restore-keys: pizza-measures-${{ hashFiles('analysis/analyse.py') }}-
      - name: Build and store the reports
        if: steps.ready.outputs.ok
        run: |
          export PIZZA_SITE_URL="${PIZZA_SITE_URL:-$(python3 cloudflare/deploy.py url)}"
          export PIZZA_MEASURE_CACHE="$HOME/.cache/pizza-measures"
          python3 tools/cloud_sync.py ${{ github.event.inputs.force == 'true' && '--force' || '' }} ${{ github.event.inputs.wait == 'true' && '--wait 300' || '' }}
