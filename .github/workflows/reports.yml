# Builds the reports and downloads of the study on Cloudflare (tools/cloud_sync.py): started by the site a few
# minutes after sessions finish and by "Rebuild now" (needs the PIZZA_GITHUB_TOKEN secret), after each deploy, and
# every 6 hours. Does nothing when no session changed. The log holds counts only; no data is kept as an artifact.
name: reports
on:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild everything even if nothing changed
        required: false
        default: 'false'
  schedule:
    - cron: '41 */6 * * *'
concurrency:
  group: cloudflare-reports
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  reports:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PIZZA_ADMIN_KEY: ${{ secrets.PIZZA_ADMIN_KEY }}
      PIZZA_SITE_URL: ${{ vars.PIZZA_SITE_URL }}
    steps:
      - name: Cloudflare set up?
        id: ready
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$PIZZA_ADMIN_KEY" ]; then echo "ok=1" >> "$GITHUB_OUTPUT";
          else echo "::notice::No reports to build: the study is not on Cloudflare yet (cloudflare/README.md)."; fi
      - uses: actions/checkout@v4
        if: steps.ready.outputs.ok
      - uses: actions/setup-python@v5
        if: steps.ready.outputs.ok
        with:
          python-version: '3.12'
      - name: Build and store the reports
        if: steps.ready.outputs.ok
        run: |
          export PIZZA_SITE_URL="${PIZZA_SITE_URL:-$(python3 cloudflare/deploy.py url)}"
          python3 tools/cloud_sync.py ${{ github.event.inputs.force == 'true' && '--force' || '' }}
