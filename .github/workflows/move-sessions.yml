# Moves sessions (and personal links) from one study to another in the live database, e.g. test sessions into the
# "tests" study. Run it from Actions -> move sessions -> Run workflow. The reports are rebuilt afterwards.
name: move sessions
on:
  workflow_dispatch:
    inputs:
      from:
        description: 'Move sessions of this study ("all" = every session, "main" = the main study)'
        required: true
        default: all
      to:
        description: 'Into this study (it must be in server/study.json; "main" = the main study)'
        required: true
        default: tests
permissions:
  contents: read
  actions: write
concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false
jobs:
  move:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PIZZA_EU: ${{ vars.PIZZA_EU }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - name: Move
        env:
          FROM: ${{ github.event.inputs.from }}
          TO: ${{ github.event.inputs.to }}
        run: |
          (cd cloudflare && npm ci --no-audit --no-fund)
          python3 cloudflare/deploy.py move "$FROM" "$TO" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Rebuild the reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run reports.yml --ref main -R "$GITHUB_REPOSITORY" -f force=true
