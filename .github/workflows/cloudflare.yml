# Deploys the study to Cloudflare (cloudflare/README.md) on every push to main that touches the study, right away:
# it first runs the Cloudflare part of the smoke test (about a minute) instead of waiting for the full checks, which
# run alongside in "check". Also on request (Actions -> cloudflare -> Run workflow). Does nothing until the repository
# has the Cloudflare secrets.
name: cloudflare
on:
  push:
    branches: [main]
    paths: ['cloudflare/**', 'server/**', 'pizza-builder.js', 'analysis/**', 'tools/**', '.github/workflows/cloudflare.yml']
  workflow_dispatch:
concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PIZZA_ADMIN_KEY: ${{ secrets.PIZZA_ADMIN_KEY }}
      PIZZA_GITHUB_TOKEN: ${{ secrets.PIZZA_GITHUB_TOKEN || secrets.PIZZA_GITHUB_TOKEN_PIZZA }}   # either name works
      PIZZA_SITE_URL: ${{ vars.PIZZA_SITE_URL }}
      PIZZA_EU: ${{ vars.PIZZA_EU }}
      R2_LIMIT_BYTES: ${{ vars.R2_LIMIT_BYTES }}
      R2_WRITES_PER_MONTH: ${{ vars.R2_WRITES_PER_MONTH }}
      R2_READS_PER_MONTH: ${{ vars.R2_READS_PER_MONTH }}
      D1_LIMIT_BYTES: ${{ vars.D1_LIMIT_BYTES }}
    steps:
      - name: Cloudflare set up?
        id: ready
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$PIZZA_ADMIN_KEY" ]; then echo "ok=1" >> "$GITHUB_OUTPUT";
          else echo "::notice::Not deploying: add the CLOUDFLARE_API_TOKEN and PIZZA_ADMIN_KEY secrets (cloudflare/README.md)."; fi
      - uses: actions/checkout@v4
        if: steps.ready.outputs.ok
      - uses: actions/setup-node@v4
        if: steps.ready.outputs.ok
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - name: Quick test of the Cloudflare part (the Worker in the local Workers runtime, about a minute)
        if: steps.ready.outputs.ok
        run: |
          (cd cloudflare && npm ci --no-audit --no-fund)
          PIZZA_REQUIRE_CLOUDFLARE=1 python3 tests/smoke_test.py --only cloudflare
      - name: Check the Cloudflare token (each line says what it can reach)
        if: steps.ready.outputs.ok
        run: |
          { echo '### Cloudflare token'; echo '```'; python3 cloudflare/deploy.py check; s=$?; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          python3 cloudflare/deploy.py check > /dev/null
      - name: Deploy (address, bot check, Worker, D1 database, R2 storage)
        if: steps.ready.outputs.ok
        run: |
          (cd cloudflare && npm ci --no-audit --no-fund)
          python3 cloudflare/deploy.py deploy
          echo "### Deployed: $(python3 cloudflare/deploy.py url)/" >> "$GITHUB_STEP_SUMMARY"
      - name: Check the live site (each study's link, the researcher page)
        if: steps.ready.outputs.ok
        run: |
          sleep 10
          { echo '### Live site'; echo '```'; python3 cloudflare/deploy.py live; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          python3 cloudflare/deploy.py live > /dev/null
      - name: Rebuild the reports (the analysis code may have changed)
        if: steps.ready.outputs.ok
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run reports.yml --ref main -R "$GITHUB_REPOSITORY" || echo "::notice::Could not start the reports job."
    permissions:
      contents: read
      actions: write
