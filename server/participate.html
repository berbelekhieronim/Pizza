<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<!-- the pizza's colours are part of the stimulus: no automatic dark mode (Chrome, Samsung) and no Dark Reader -->
<meta name="color-scheme" content="only light">
<meta name="darkreader-lock">
<title>Make a pizza</title>
<style>
  :root { color-scheme:only light; --ink:#2a2421; --muted:#6e635b; --line:#e3dbd2; --bg:#f6f2ed; --accent:#a8361d; }
  body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .wrap { max-width:980px; margin:0 auto; padding:12px 16px; }
  .sheet { background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px 18px; }
  h1 { font-size:1.35rem; margin:0 0 10px; }
  .intro p { max-width:62ch; }
  label.consent { display:flex; gap:10px; align-items:flex-start; margin:16px 0; max-width:62ch; cursor:pointer; }
  label.consent input { width:22px; height:22px; margin-top:2px; flex:none; }
  .next { display:flex; justify-content:flex-end; margin-top:16px; }
  .next[hidden] { display:none; }   /* without this the display rule above keeps a hidden Next button on screen */
  button.go { font:inherit; font-weight:600; padding:12px 24px; border-radius:10px; border:0; background:var(--accent); color:#fff; cursor:pointer; }
  button.go:disabled { opacity:.45; cursor:default; }
  .code { font:600 1.6rem/1.2 ui-monospace, Menlo, Consolas, monospace; letter-spacing:.06em; background:#f4efe9; border-radius:10px; padding:10px 14px; display:inline-block; user-select:all; }
  .status { color:var(--muted); font-size:.85rem; margin:8px 0 0; }
  .status:empty { display:none; }   /* no empty line under the task: the page fits the window */
  .notice { background:#f4efe9; border-radius:10px; padding:8px 12px; margin:0 0 10px; font-size:.95rem; }
  .notice[hidden] { display:none; }
  /* a request the participant can act on (switch the translation off, enlarge the window); never translated itself */
  .ask { background:#fff4d6; border:1px solid #e8c56a; border-radius:10px; padding:8px 12px; margin:0 0 10px; font-size:.95rem; }
  .ask[hidden] { display:none; }
  .ask p { margin:2px 0; }
  .choice { display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin:18px 0 4px; max-width:62ch; }
  .choice p { margin:0; font-weight:600; flex-basis:100%; }
  .choice button { min-width:7em; }
  button.alt { background:#fff; color:var(--ink); border:1px solid var(--line); }
  .baked { display:flex; justify-content:center; margin:14px 0 6px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="sheet">
    <p class="notice" id="notice" hidden></p>
    <div class="ask" id="ask" hidden translate="no" role="status"></div>
    <div id="stage"><noscript><h1>JavaScript</h1><p lang="pl">To badanie działa tylko z włączonym JavaScriptem. Włącz go dla tej strony (albo otwórz link w innej przeglądarce) i odśwież stronę.</p>
      <p lang="en">This study needs JavaScript. Turn it on for this page (or open the link in another browser) and reload.</p></noscript></div>
    <div class="next" id="next" hidden><button class="go" type="button"></button></div>
    <p class="status" id="status" aria-live="polite"></p>
  </div>
</div>
<script src="pizza-builder.js"></script>
<script>
(function () {
  if (!window.fetch || !window.Promise || !window.URLSearchParams || !window.PizzaBuilder) {    // a very old browser, or the task script was blocked
    document.getElementById('stage').innerHTML = '<h1>Przeglądarka / Browser</h1><p lang="pl">Ta przeglądarka nie może wyświetlić badania. Otwórz link w aktualnej wersji Chrome, Edge, Firefoxa lub Safari.</p>'
      + '<p lang="en">This browser cannot show the study. Please open the link in a current Chrome, Edge, Firefox or Safari.</p>';
    return;
  }
  var params = new URLSearchParams(location.search);
  var S = { pid: null, cond: '', fields: {}, stage: 'intro', study: {} };
  // the page's own words, in the study's language (study.json "lang"); the task brings its own (pizza-builder.js LANG)
  var WORDS = {
    en: { next: 'Next \u2192', saveFail: 'Could not save just now; it will try again.', offline: 'Connection lost; your answers are kept and will be sent when it is back.',
      welcome: 'Welcome back. You can carry on from the part you were on.', moment: 'One moment', botCheck: 'Checking that you are a person, not a bot (this usually takes a second).',
      botFailTitle: 'This link does not work just now', botFail: 'The check that you are a person did not pass. Please reload the page. If it happens again, switch off ad blocking or privacy extensions for this page, or open the link in another browser.',
      badLink: 'This link does not work', cantStart: 'The study could not start. Please check your connection and reload the page.',
      retrying: 'Connecting to the study\u2026 This can take a minute; please keep this page open.',
      thanks: 'Thank you', back: 'Taking you back in a moment\u2026', agree: 'I agree to take part.', consentTitle: 'Informed consent',
      yes: 'YES', no: 'NO', declinedTitle: 'Thank you', declined: 'You chose not to take part, so the study ends here. You can close this page.',
      typical: 'Now make the pizza you think a typical person taking part in this study would choose. Drag toppings onto the pizza; drag a topping off to remove it.' },
    pl: { next: 'Dalej \u2192', saveFail: 'Nie udało się teraz zapisać; spróbujemy ponownie.', offline: 'Utracono połączenie; Twoje odpowiedzi są zachowane i zostaną wysłane, gdy wróci.',
      welcome: 'Witaj ponownie. Możesz kontynuować od miejsca, w którym przerwano.', moment: 'Chwileczkę', botCheck: 'Sprawdzamy, czy jesteś osobą, a nie botem (zwykle trwa to sekundę).',
      botFailTitle: 'Ten link chwilowo nie działa', botFail: 'Sprawdzenie nie powiodło się. Odśwież stronę. Jeśli to się powtórzy, wyłącz na tej stronie blokowanie reklam lub rozszerzenia prywatności albo otwórz link w innej przeglądarce.',
      badLink: 'Ten link nie działa', cantStart: 'Nie udało się rozpocząć badania. Sprawdź połączenie z internetem i odśwież stronę.',
      retrying: 'Łączenie z badaniem\u2026 Może to potrwać do minuty; nie zamykaj tej strony.',
      thanks: 'Dziękujemy!', back: 'Za chwilę nastąpi przekierowanie\u2026', agree: 'Wyrażam zgodę na udział w badaniu.', consentTitle: 'Świadoma zgoda',
      yes: 'TAK', no: 'NIE', declinedTitle: 'Dziękujemy', declined: 'Nie wyrażono zgody na udział, więc badanie kończy się w tym miejscu. Możesz zamknąć tę stronę.',
      typical: 'Teraz zrób pizzę, którą Twoim zdaniem wybrałaby typowa osoba biorąca udział w tym badaniu. Przeciągaj składniki na pizzę; przeciągnij składnik poza pizzę, aby go usunąć.' }
  };
  var L = WORDS.en;
  // a study's own wording for these (study.json "texts": page.<key>, made with tools/texts.py) replaces the defaults
  function words(lang, own) {
    L = {}; var base = WORDS[lang] || WORDS.en;
    for (var k in base) L[k] = base[k];
    for (var key in (own || {})) if (key.indexOf('page.') === 0 && typeof own[key] === 'string' && own[key] && L[key.slice(5)] != null) L[key.slice(5)] = own[key];
    document.documentElement.lang = ownLang = WORDS[lang] ? lang : 'en'; next.querySelector('button').textContent = L.next;
  }
  var stage = document.getElementById('stage'), next = document.getElementById('next'), status = document.getElementById('status'), notice = document.getElementById('notice');
  var widget = null, timer = null, pending = false;
  var ownLang = null;   // the page's own language (words()); another one means the browser translated the page
  var acked = {};       // the value of each field the server last confirmed: leaving the page sends only what is newer
  // sessionStorage keeps the participant id across a reload. With cookies blocked (Chrome, Firefox and Edge settings,
  // some privacy extensions) even reading it throws, so every use goes through these; without storage the id goes into
  // the address instead (see start), so a reload still resumes the same session.
  function stored(k) { try { return window.sessionStorage.getItem(k); } catch (e) { return null; } }
  function store(k, v) { try { window.sessionStorage.setItem(k, v); return window.sessionStorage.getItem(k) === v; } catch (e) { return false; } }

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  // Save to the server: batched every 4 seconds while working, at once at the end of each page, and on leaving the page
  // (fewer requests and database writes; at most the last 4 seconds are lost if the browser crashes).
  function send(now) {
    clearTimeout(timer);
    if (!now) { timer = setTimeout(function () { send(true); }, 4000); return; }
    if (!S.pid) return;
    var snap = {}; for (var k in S.fields) snap[k] = S.fields[k];
    var body = JSON.stringify({ pid: S.pid, stage: S.stage, fields: snap });
    pending = true;
    return fetch('api/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: body, keepalive: body.length < 60000 })
      .then(function (r) {
        pending = false; status.textContent = r.ok ? '' : L.saveFail;
        if (r.ok) { for (var k in snap) acked[k] = snap[k]; } else { failed(); send(); }
      })
      .catch(function () { pending = false; status.textContent = L.offline; failed(); send(); });
  }
  // saves that did not go through (offline, server busy): counted, so the researcher can see a session had trouble
  function failed() { S.fields.save_fails = String((+S.fields.save_fails || 0) + 1); }
  // Leaving or hiding the page (closing the tab, switching away, the computer going to sleep): send what the server has
  // not confirmed yet, at once. A fetch with keepalive first: ad blockers such as uBlock Origin block "beacon" requests
  // (their "hyperlink auditing" setting, on by default), and some privacy settings remove navigator.sendBeacon. Both
  // carry at most 64 KB, so only the unconfirmed fields go; the beacon is the fallback.
  function flush() {
    if (!S.pid) return;
    var fresh = {}, any = false;
    for (var k in S.fields) if (acked[k] !== S.fields[k]) { fresh[k] = S.fields[k]; any = true; }
    var body = JSON.stringify({ pid: S.pid, stage: S.stage, fields: fresh });
    function beacon() { try { return !!(navigator.sendBeacon && navigator.sendBeacon('api/save', new Blob([body], { type: 'application/json' }))); } catch (e) { return false; } }
    if (body.length < 60000) {
      try {
        fetch('api/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: body, keepalive: true })
          .then(function (r) { if (r.ok) { for (var k in fresh) acked[k] = fresh[k]; } else beacon(); }, beacon);
        return;
      } catch (e) { /* keepalive refused: the beacon below */ }
    }
    if (any || S.stage) beacon();
  }
  window.addEventListener('pagehide', flush);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') flush(); });
  // errors in the page (a broken browser extension, an old browser): kept with the session, at most 20
  function pageError(msg) {
    if (!S.pid) return;
    try {
      var list = JSON.parse(S.fields.client_errors || '[]');
      if (list.length >= 20) return;
      list.push([new Date().toISOString().slice(0, 19) + 'Z', S.stage, String(msg).slice(0, 300)]);
      S.fields.client_errors = JSON.stringify(list); send();
    } catch (e) { /* never let this break the study */ }
  }
  window.addEventListener('error', function (e) { pageError((e.message || 'error') + (e.filename ? ' @ ' + e.filename.split('/').pop() + ':' + e.lineno : '')); });
  window.addEventListener('unhandledrejection', function (e) { pageError('promise: ' + ((e.reason && e.reason.message) || e.reason)); });
  // the participant's browser, system and screen, for the researcher page and the analysis (no IP address, no location)
  function browserOs(ua) {
    var b = 'other', m;
    if ((m = ua.match(/Edg(?:e|A|iOS)?\/(\d+)/))) b = 'Edge ' + m[1];
    else if ((m = ua.match(/(?:OPR|Opera)\/(\d+)/))) b = 'Opera ' + m[1];
    else if ((m = ua.match(/SamsungBrowser\/(\d+)/))) b = 'Samsung Internet ' + m[1];
    else if ((m = ua.match(/(?:Firefox|FxiOS)\/(\d+)/))) b = 'Firefox ' + m[1];
    else if ((m = ua.match(/(?:Chrome|CriOS)\/(\d+)/))) b = 'Chrome ' + m[1];
    else if ((m = ua.match(/Version\/(\d+)[\d.]* .*Safari\//))) b = 'Safari ' + m[1];
    var o = 'other';
    if (/Windows NT 10/.test(ua)) o = 'Windows 10/11';
    else if ((m = ua.match(/Windows NT (\d+\.\d+)/))) o = 'Windows NT ' + m[1];
    else if (/iPhone|iPad|iPod/.test(ua)) o = 'iOS';
    else if (/Mac OS X/.test(ua)) o = 'macOS';
    else if (/CrOS/.test(ua)) o = 'ChromeOS';
    else if ((m = ua.match(/Android (\d+)/))) o = 'Android ' + m[1];
    else if (/Linux/.test(ua)) o = 'Linux';
    return [b, o];
  }
  function client() {
    try {
      var ua = navigator.userAgent || '', bo = browserOs(ua), tz = '';
      try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) {}
      if (navigator.brave) bo[0] = bo[0].replace(/^Chrome/, 'Brave');     // Brave says it is Chrome
      var mq = function (q) { try { return window.matchMedia(q).matches; } catch (e) { return null; } };
      var res = timerResolution();
      var c = { ua: ua, browser: bo[0], os: bo[1], tz: tz, tzOffset: -new Date().getTimezoneOffset(), lang: navigator.language || '',
        langs: (navigator.languages || []).slice(0, 5), screen: [screen.width, screen.height], viewport: [innerWidth, innerHeight],
        dpr: window.devicePixelRatio || 1, touch: navigator.maxTouchPoints || 0, cores: navigator.hardwareConcurrency || null,
        // what the browser allows (privacy settings, blockers, extensions) and what that means for the data
        storage: !!S.storage, cookies: navigator.cookieEnabled !== false, beacon: typeof navigator.sendBeacon === 'function',
        timerMs: res, webdriver: !!navigator.webdriver, brave: !!navigator.brave, gpc: navigator.globalPrivacyControl === true,
        dnt: navigator.doNotTrack === '1' || window.doNotTrack === '1', forcedColors: mq('(forced-colors: active)'), reducedMotion: mq('(prefers-reduced-motion: reduce)'),
        at: new Date().toISOString().slice(0, 19) + 'Z' };
      // the ones that change how the study runs or what its numbers mean, as a short list for the researcher page
      var flags = [];
      if (!c.storage) flags.push('storage-blocked');
      if (!c.beacon) flags.push('no-beacon');
      if (res == null || res >= 10) flags.push('coarse-timer');      // Firefox "resist fingerprinting", Tor: times in steps of 16-100 ms
      if (c.webdriver) flags.push('automated');                      // a browser driven by a program
      if (c.forcedColors) flags.push('forced-colors');               // Windows high contrast: colours replaced
      if (c.brave) flags.push('brave');
      S.flagList = flags;
      S.fields.client = JSON.stringify(c); S.fields.browser = bo[0]; S.fields.os = bo[1]; S.fields.tz = tz; S.fields.browser_flags = flags.join(' ');
      // Chromium browsers tell Windows 11 from 10 only when asked
      if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues && bo[1] === 'Windows 10/11') {
        navigator.userAgentData.getHighEntropyValues(['platformVersion']).then(function (h) {
          var v = parseInt((h && h.platformVersion) || '', 10);
          if (!isNaN(v)) { S.fields.os = v >= 13 ? 'Windows 11' : 'Windows 10'; c.os = S.fields.os; S.fields.client = JSON.stringify(c); send(); }
        }).catch(function () {});
      }
    } catch (e) { /* never let this break the study */ }
  }
  function onSave(k, v) { S.fields[k] = v; send(); }
  // Requests the participant can act on at once, shown above the task until done; written in both languages and marked
  // translate="no", so they stay readable whatever the browser does to the page
  var ASK = {
    translated: '<p lang="pl"><b>Przeglądarka przetłumaczyła tę stronę.</b> Prosimy o powrót do oryginału (w pasku przeglądarki: „Pokaż oryginał” / ikona tłumaczenia), aby wszyscy widzieli te same słowa.</p>'
      + '<p lang="en"><b>Your browser has translated this page.</b> Please switch back to the original ("Show original" in the browser\'s translate menu) so that everyone sees the same wording.</p>',
    small: '<p lang="pl"><b>Okno przeglądarki jest za małe na to zadanie.</b> Powiększ je (np. dwuklik na pasku tytułu albo F11) lub pomniejsz stronę (Ctrl i minus).</p>'
      + '<p lang="en"><b>The browser window is too small for this task.</b> Please make it bigger (e.g. double-click the title bar, or F11), or zoom out (Ctrl and minus).</p>'
  };
  var asks = {};
  function asking(kind, on) {
    asks[kind] = on;
    var box = document.getElementById('ask'), html = Object.keys(asks).filter(function (k) { return asks[k]; }).map(function (k) { return ASK[k]; }).join('');
    box.innerHTML = html; box.hidden = !html;
  }
  // The task needs room: the pizza and the tray side by side. A window smaller than 900 x 600 while building is asked to
  // grow (flag small-window and the smallest size seen, field small_window, so the researcher can look at it).
  function windowCheck() {
    if (!S.pid || ['practice', 'build', 'typical'].indexOf(S.stage) < 0) { if (asks.small) asking('small', false); return; }
    var w = window.innerWidth, h = window.innerHeight, small = w < 900 || h < 600;
    if (small) {
      var prev = (S.fields.small_window || '').split('x'), mw = Math.min(w, +prev[0] || w), mh = Math.min(h, +prev[1] || h);
      if (S.fields.small_window !== mw + 'x' + mh) { S.fields.small_window = mw + 'x' + mh; send(); }
      if (S.flagList && S.flagList.indexOf('small-window') < 0) { S.flagList.push('small-window'); S.fields.browser_flags = S.flagList.join(' '); send(); }
    }
    if (!!asks.small !== small) asking('small', small);
  }
  window.addEventListener('resize', function () { clearTimeout(windowCheck.t); windowCheck.t = setTimeout(windowCheck, 400); });
  // the smallest step of the page's clock in ms (about 0.1 normally; 16-100 with fingerprinting protection, which
  // makes the task's timings coarse), null when it did not move within 25 ms
  function timerResolution() {
    try {
      var t0 = performance.now(), t = t0, best = null, last = t0, n = 0;
      while (t - t0 < 25 && n < 200000) { t = performance.now(); n++; if (t !== last) { var d = t - last; if (best === null || d < best) best = d; last = t; } }
      return best === null ? null : Math.round(best * 1000) / 1000;
    } catch (e) { return null; }
  }
  // the page translated by the browser (Chrome / Edge "Translate this page"): what participants read is no longer the
  // study's wording. Recorded (browser_flags "translated", and when), not prevented.
  try {
    new MutationObserver(function () {
      var h = document.documentElement;
      if (!S.pid) return;
      var now = /translated-(ltr|rtl)/.test(h.className) || (ownLang && h.lang && h.lang !== ownLang);
      var t = new Date().toISOString().slice(0, 19) + 'Z';
      if (now && !S.translatedNow) {
        S.translatedNow = true;
        S.fields.translated = (S.fields.translated ? S.fields.translated + '; ' : '') + S.stage + ' ' + t + ' ' + (h.lang || '');
        if (!S.translated) { S.translated = true; S.flagList = (S.flagList || []).concat('translated'); S.fields.browser_flags = S.flagList.join(' '); }
        asking('translated', true); send();
      } else if (!now && S.translatedNow) {       // back to the original: thank you, and when
        S.translatedNow = false;
        S.fields.translated += ' - original again ' + t;
        asking('translated', false); send();
      }
    }).observe(document.documentElement, { attributes: true, attributeFilter: ['class', 'lang'] });
  } catch (e) { /* old browser */ }

  function order() {
    var o = ['intro', 'practice', 'build'];
    if (S.study.typical_build) o.push('typical');
    return o.concat(['followup', 'done']);
  }
  function go(name) {
    S.stage = name;
    if (widget && widget.destroy) widget.destroy();
    widget = null;
    stage.innerHTML = '';
    next.hidden = true;
    var o = order(), i = o.indexOf(name);     // no "part i of n": the participant only sees the task itself
    window.scrollTo(0, 0);
    send(true);
    if (name === 'intro') return intro();
    if (name === 'done') return done();
    if (name === 'declined') return declined();
    if (S.resumed) S.resumed = false; else notice.hidden = true;
    setTimeout(windowCheck, 50);   // the "welcome back" note shows on the part they came back to only
    var box = document.createElement('div');
    stage.appendChild(box);
    var opts = { mode: name === 'typical' ? 'build' : name, onSave: onSave, condition: S.cond, onFinish: function () { send(true); go(o[i + 1]); } };
    opts.maxEventChars = 500000;   // the study server keeps the whole log (the 60,000 default is for Qualtrics' embedded data)
    if (S.study.lang) opts.lang = S.study.lang;
    if (S.study.texts) opts.texts = S.study.texts;
    if (name === 'typical') {
      opts.prefix = 'pzt_';
      opts.prompt = L.typical;
    }
    if (name === 'followup') {
      opts.counts = S.fields.pz_counts || null; opts.askAbout = S.study.about_you !== false;
      if (S.study.followup) opts.style = S.study.followup;     // e.g. "metryczka": only the short demographic card
    }
    if (name === 'build' || name === 'typical') {
      ['sauces', 'sauce', 'cheeses', 'cheese'].forEach(function (k) { if (S.study[k] != null) opts[k] = S.study[k]; });   // the study's base choices
      // study settings for what people see while building; condition_settings can vary them by condition (an experiment)
      var cs = (S.study.condition_settings || {})[S.cond] || {};
      opts.nutrition = cs.nutrition_panel != null ? !!cs.nutrition_panel : !!S.study.nutrition_panel;
      // "Show nutrition information" button + nutrition in the "I'm done" dialog: the own build, the typical build only by condition
      opts.nutritionReveal = cs.nutrition_reveal != null ? !!cs.nutrition_reveal : (name === 'build' && !!S.study.nutrition_reveal);
      var show = cs.nutrition_show || S.study.nutrition_show;
      if (show) opts.nutritionShow = show;
      if ((cs.nutrition_base != null ? cs.nutrition_base : S.study.nutrition_base) === false) opts.nutritionBase = false;
    }
    widget = PizzaBuilder.mount(box, opts);
  }
  function intro() {
    var st = S.study, paras = (st.intro || []).map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('');
    if (st.consent_choice) {             // consent as a question with two answers: YES goes on, NO ends the study
      stage.innerHTML = '<div class="intro"><h1>' + esc(L.consentTitle) + '</h1>' + paras + '<div class="choice"><p>' + esc(st.consent || L.agree) + '</p>' +
        '<button class="go" type="button" id="yes">' + esc(L.yes) + '</button><button class="go alt" type="button" id="no">' + esc(L.no) + '</button></div></div>';
      document.getElementById('yes').onclick = function () { S.fields.consent = new Date().toISOString(); go('practice'); };
      document.getElementById('no').onclick = function () { S.fields.consent = 'declined ' + new Date().toISOString(); go('declined'); };
      return;
    }
    stage.innerHTML = '<div class="intro"><h1>' + esc(st.title || 'Make a pizza') + '</h1>' + paras +
      '<label class="consent"><input type="checkbox" id="agree"> <span>' + esc(st.consent || L.agree) + '</span></label></div>';
    var box = document.getElementById('agree');
    next.hidden = false;
    var btn = next.querySelector('button');
    btn.disabled = true;
    box.onchange = function () { btn.disabled = !box.checked; };
    btn.onclick = function () { if (!box.checked) return; btn.disabled = false; S.fields.consent = new Date().toISOString(); go('practice'); };
  }
  function declined() {
    stage.innerHTML = '<h1>' + esc(L.declinedTitle) + '</h1><p>' + esc(S.study.decline_message || L.declined) + '</p>';
    send(true);
  }
  function done() {
    var st = S.study;
    stage.innerHTML = '<h1>' + esc(st.completion_title || L.thanks) + '</h1><p>' + esc(st.completion_message || '') + '</p>';
    if (st.bake_picture && S.fields.pz_final) {          // the participant's own pizza, baked
      var pic = document.createElement('div'); pic.className = 'baked';
      pic.appendChild(PizzaBuilder.picture(S.fields.pz_final, S.fields.pz_summary, Math.min(380, (stage.clientWidth || 380) - 20)));
      stage.appendChild(pic);
    }
    if (st.show_code !== false) stage.insertAdjacentHTML('beforeend', '<p class="code">' + esc(S.pid) + '</p>');
    var finish = send(true);
    if (st.completion_redirect) {
      stage.insertAdjacentHTML('beforeend', '<p>' + esc(L.back) + '</p>');
      Promise.resolve(finish).then(function () { setTimeout(function () { location.href = st.completion_redirect; }, 1500); });
    }
  }

  words('en');
  // ?i=<invite> (a personal link), or ?study=<id>&group=..&source=.. (an open study link), or nothing (the main study)
  var link = { i: params.get('i') || '', study: params.get('study') || '', source: params.get('source') || '' };
  var studyInfo = fetch('study.json?' + new URLSearchParams({ i: link.i, study: link.study })).then(function (r) { return r.json(); }).catch(function () { return {}; });
  if (!PizzaBuilder.isDesktop()) {        // computers only: no session is started on a phone or tablet
    studyInfo.then(function (st) {
      var T = PizzaBuilder.texts((st || {}).lang, (st || {}).texts);
      stage.innerHTML = '<h1>' + esc(T.desktopTitle) + '</h1><p>' + esc(T.desktopBody) + '</p>';
    });
    return;
  }
  studyInfo.then(function (st) { words((st || {}).lang, (st || {}).texts); });
  // A start that fails for a passing reason (no connection, the server busy, too many people starting from one network
  // at once, e.g. a computer lab) is tried again for about two minutes, with a note, before giving up.
  function start(ts, nocheck) {
    var q = new URLSearchParams({ pid: link.i ? '' : (params.get('pid') || params.get('PROLIFIC_PID') || stored('pz-pid') || ''),
      group: params.get('group') || '', cond: params.get('cond') || '', i: link.i, study: link.study, source: link.source, ts: ts || '', nocheck: nocheck || '' });
    var waits = [2, 4, 8, 15, 30, 60], n = 0;
    function attempt() {
      return fetch('api/start?' + q).then(function (r) {
        if (r.status === 429 || r.status >= 500) throw new Error('busy ' + r.status);
        return r.json();
      }).catch(function (e) {
        if (n >= waits.length) throw e;
        stage.innerHTML = '<h1>' + esc(L.moment) + '</h1><p>' + esc(L.retrying) + '</p>';
        return new Promise(function (res) { setTimeout(res, waits[n++] * 1000); }).then(attempt);
      });
    }
    return attempt();
  }
  // On Cloudflare, a new session may first need Turnstile's quick check that a person (not a bot) opened the link;
  // it usually passes by itself. The Python study server never asks for it.
  function checked(res) {
    if (!res.verify) return res;
    stage.innerHTML = '<h1>' + esc(L.moment) + '</h1><p>' + esc(L.botCheck) + '</p><div id="ts"></div>';
    // The check runs on Cloudflare's own address (challenges.cloudflare.com), which some blockers, firewalls and strict
    // privacy settings stop, and it can fail in hardened browsers. Then the page never waits forever: when the check
    // cannot load, errors, is unsupported or takes over 45 s, it asks the server once more with the reason (nocheck=...).
    // The Worker decides: as it stands it still asks for the check, and the participant sees the "could not confirm"
    // message (L.botFail) with what to do, instead of a page stuck on "one moment".
    return new Promise(function (resolve, reject) {
      var settled = false, timer;
      function finish(p) { clearTimeout(timer); p.then(resolve, reject); }
      function fallback(why) { if (settled) return; settled = true; finish(start('', String(why).slice(0, 40))); }
      function passed(token) {
        if (settled) return; settled = true;
        finish(start(token).then(function (r) { return r.verify ? start('', 'rejected') : r; }));
      }
      timer = setTimeout(function () { fallback('timeout'); }, 45000);
      var s = document.createElement('script');
      s.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
      s.onload = function () {
        try {
          window.turnstile.render('#ts', { sitekey: res.verify, callback: passed,
            'error-callback': function (code) { fallback('error-' + code); return true; },
            'unsupported-callback': function () { fallback('unsupported'); }, 'timeout-callback': function () { fallback('timeout'); } });
        } catch (e) { fallback('render'); }
      };
      s.onerror = function () { fallback('blocked'); };
      document.head.appendChild(s);
    });
  }
  Promise.all([studyInfo, start().then(checked)]).then(function (res) {
    if (res[1].verify) {
      stage.innerHTML = '<h1>' + esc(L.botFailTitle) + '</h1><p>' + esc(L.botFail) + '</p>';
      return;
    }
    if (res[1].error) {                    // a mistyped or unknown link: never start an unlabelled session
      stage.innerHTML = '<h1>' + esc(L.badLink) + '</h1><p>' + esc(res[1].error) + '</p>';
      return;
    }
    S.study = res[0] || {};
    words(S.study.lang, S.study.texts);
    S.pid = res[1].pid; S.cond = res[1].cond || '';
    S.storage = store('pz-pid', S.pid);
    if (!S.storage && !link.i && params.get('pid') !== S.pid) {     // no storage: the id in the address keeps a reload in this session
      try { var u = new URL(location.href); u.searchParams.set('pid', S.pid); history.replaceState(null, '', u.toString()); } catch (e) {}
    }
    client();
    document.title = S.study.title || document.title;
    // coming back (a reload, a closed tab, a personal link opened again): no second consent; the part they were on
    // starts again, the follow-up keeps what the build saved, and restarts are counted for the analysis
    var was = res[1].stage;
    if (was === 'done') return go('done');
    if (was === 'declined') return go('declined');
    if (order().indexOf(was) > 0) {
      if (res[1].counts) S.fields.pz_counts = res[1].counts;
      S.fields.restarts = String((+res[1].restarts || 0) + 1);
      notice.textContent = L.welcome;
      notice.hidden = false;
      S.resumed = true;
      return go(was);
    }
    go('intro');
  }).catch(function () {
    stage.innerHTML = '<p>' + esc(L.cantStart) + '</p>';
  });
})();
</script>
</body>
</html>
